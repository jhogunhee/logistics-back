services:
  - type: web
    name: wms-back
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # 세션 쿠키 — 프론트(Cloudflare)와 사이트가 갈려 none+secure가 아니면 쿠키가 안 실린다
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: SESSION_COOKIE_SECURE
        value: "true"
