services:
  - type: web
    name: wms-back
    runtime: docker
    plan: free
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # JWT 서명키. 안 넣으면 로컬 기본값으로 서명한다 — 반드시 32바이트 이상으로 지정할 것
      - key: JWT_SECRET
        sync: false
