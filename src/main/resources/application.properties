# Oracle — 로컬 XE 21c(서비스명 XEPDB1) 기본. docker(gvenzl/oracle-free) 사용 시 DB_SERVICE=FREEPDB1
#spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
#spring.datasource.url=jdbc:oracle:thin:@localhost:1521/${DB_SERVICE:XEPDB1}
#spring.datasource.username=${DB_USERNAME:wms}
#spring.datasource.password=${DB_PASSWORD:wms1234}

# Render가 주입하는 PORT를 따르고, 로컬은 8080 유지
server.port=${PORT:8080}
server.tomcat.threads.max=20

# ===== Supabase PostgreSQL =====
# 최초 설정: environment variables에 추가
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP — Supavisor pooler 한도(session mode: 15) 안에서 동작하도록 축소
# 기본값(max 10 / min-idle 10)은 유휴 커넥션 10개를 상시 점유해 한도를 쉽게 넘김
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=10000

# JPA
# 스키마는 docs/schema.sql로 직접 관리 → Hibernate는 테이블을 만들지도, 엔티티와 대조하지도 않는다.
# validate가 아니라 none인 이유는 뷰·부분 인덱스 등 Hibernate가 이해하지 못하는 것들 때문이다.
# 대신 엔티티가 없는 컬럼을 가리켜도 기동 시점에는 조용하고 조회할 때 터진다.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# 지연 로딩 컬렉션을 IN 쿼리로 묶어 로딩 (환산수량 합계가 읽는 prod.uoms 등의 N+1 방지).
# DB가 원격(Supabase)이라 쿼리 횟수가 곧 지연 시간이다 — 이 설정이 빠지면 목록 조회가 타임아웃 난다.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# CORS — 배포 환경에서는 CORS_ALLOWED_ORIGINS에 프론트 도메인을 콤마로 나열
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://wareflow-27p.pages.dev}

# ===== 세션 =====
# 저장소는 DB다 — 인메모리면 Render 무료 인스턴스가 유휴 슬립·재시작할 때마다 전원 로그아웃된다.
# 테이블은 라이브러리가 만들지 않고 docs/schema.sql이 갖는다(스키마의 주인은 하나).
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=${SESSION_TIMEOUT:12h}
server.servlet.session.cookie.name=WMSSESSION
server.servlet.session.cookie.http-only=true
# 로컬은 localhost:5173 → localhost:8080이라 같은 사이트지만, 배포는 Cloudflare ↔ Render로
# 사이트가 갈려 none+secure가 아니면 쿠키가 아예 안 실린다. Secure는 https를 요구하므로
# 로컬 기본값은 lax/false로 두고 배포 환경변수로 덮는다 (render.yaml).
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# PDA 간편 로그인(작업자 코드 스캔)으로 연 세션의 유휴 만료. 비밀번호를 묻지 않고 여는 세션이라
# 위 12h와 따로 짧게 둔다 — 교대 중에는 요청이 계속 나가 끊기지 않고, 단말을 두고 간 뒤에만 닫힌다
wms.pda.scan-session-timeout=${PDA_SCAN_SESSION_TIMEOUT:PT4H}

# p6spy SQL 로그 — 출력 형식은 P6spyPrettySqlFormatter가 담당 (multiline 설정은 기본 포맷용이라 제거)
decorator.datasource.p6spy.enable-logging=true

# 정기 보충 실행 시각 (매일 03:00 — 피킹이 멈춘 시간대). "-"로 두면 스케줄 비활성 (화면 수동 발행만)
spmt.cron=${SPMT_CRON:0 0 3 * * *}

# 자동발주 산정 시각 (매일 04:00 — 정기 보충 뒤. 순서 의존은 없다, 순재고는 창고 전체 합이라).
# "-"로 두면 스케줄 비활성 (화면 수동 발행만)
ato-odr.cron=${ATO_ODR_CRON:0 0 4 * * *}
