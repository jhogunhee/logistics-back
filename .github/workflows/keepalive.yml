name: Keep Render awake
# Render 무료 플랜은 15분 유휴 후 잠들고, 다시 깨우는 데 1분 가까이 걸린다.
# 유휴 구간을 만들지 않는 것이 목적이라 응답 내용은 보지 않는다.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # 잠들어 있었다면 첫 요청은 502/503으로 즉시 떨어진다 — 기동될 때까지 다시 부른다
      - run: |
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$URL" || echo 000)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
        env:
          URL: https://logistics-back.onrender.com/master/codes/groups
