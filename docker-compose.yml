# 로컬 개발용 PostgreSQL. 배포는 Supabase를 쓴다.
# 기동하면 docs/schema.sql → docs/seed-dev.sql 순으로 자동 적용된다(최초 1회, 볼륨이 비어 있을 때).
services:
  postgres:
    image: postgres:17
    container_name: wms-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      # application.properties의 로컬 기본값이 빈 비밀번호라 trust로 맞춘다 (로컬 전용).
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docs/seed-dev.sql:/docker-entrypoint-initdb.d/02-seed-dev.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
